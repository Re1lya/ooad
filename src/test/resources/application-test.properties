# 测试连接真实 MySQL（规范：数据库集成测试不用内存库，也不 mock 数据库）。
# 连接信息取自环境变量；未设置时连本机 3306 端口的 rbac_test 库，账号需要该库的建表、删表权限。
spring.datasource.url=jdbc:mysql://${TEST_DB_HOST:127.0.0.1}:${TEST_DB_PORT:3306}/${TEST_DB_NAME:rbac_test}?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${TEST_DB_USERNAME:rbac_test}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 表结构与部署一致：每个 Spring 上下文启动时先删表，再执行部署用建表脚本；Hibernate 只校验实体映射。
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/drop-tables.sql,file:docs/first-review/database-mysql.sql
spring.jpa.hibernate.ddl-auto=validate
