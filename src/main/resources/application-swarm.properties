# Docker Swarm 运行配置：SPRING_PROFILES_ACTIVE=swarm
# 密钥由 Docker secret 以文件形式挂到 /run/secrets/<属性名>，经 configtree 读取，不写入环境变量。
spring.config.import=optional:configtree:/run/secrets/

server.address=0.0.0.0
server.port=18081
server.shutdown=graceful
server.forward-headers-strategy=framework
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.datasource.url=${PERMISSION_DB_URL}
spring.datasource.username=${PERMISSION_DB_USERNAME}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${PERMISSION_DB_POOL_SIZE:10}
spring.datasource.hikari.keepalive-time=300000
spring.jpa.hibernate.ddl-auto=validate

# 健康检查走独立管理端口，不经过 /api 拦截器，也不通过 ingress 发布。
management.server.port=18082
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# logback：控制台（docker service logs）+ /app/logs/permission.log
permission.logging.dir=/app/logs
logging.level.com.cdwy.permission=${PERMISSION_LOG_LEVEL:INFO}
logging.level.com.cdwy.permission.infrastructure=${PERMISSION_LOG_LEVEL_INFRASTRUCTURE:INFO}
