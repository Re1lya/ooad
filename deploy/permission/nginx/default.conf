server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    client_max_body_size 12m;
    # 跳转用相对地址：对外端口（8080）与容器内的 80 不同，绝对地址会丢掉对外端口
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 首页进权限台账；原管理控制台仍在 /ui/
    location = / {
        return 302 /access-registry/index.html;
    }

    location = /ui/index.html {
        add_header Cache-Control "no-store";
    }

    location /ui/ {
        try_files $uri $uri/ /ui/index.html;
    }

    location = /access-registry/index.html {
        add_header Cache-Control "no-store";
    }

    location /access-registry/ {
        try_files $uri $uri/ /access-registry/index.html;
    }

    # 后端接口：保留 /api 前缀，经 Swarm DNS 访问 rbac-backend；
    # X-Client-Menu（当前菜单）原样转发，后端 logback 日志按菜单标记请求。
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $rbac_upstream rbac-backend:18081;
        proxy_pass http://$rbac_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
    }
}
