# Cdwy 统一权限管理系统：Docker Swarm stack（stack 名 cdwy）。
#
#   浏览器 ──► rbac-frontend:80（host 模式，发布在权限系统节点）──/api/──► rbac-backend:18081
#   课程系统 course-mgt-backend ──javaee-proxy──► rbac-backend:18081/api/apps/course-project-management
#   rbac-backend ──javaee-proxy──► mysql:3306
#
# 部署（在管理节点，仓库 deploy 目录的副本中）：
#   (set -a; . ./.env; set +a; docker stack deploy --resolve-image never -c stack.yml cdwy)
# 变量见 .env.example。数据库密码、JWT 密钥、管理员初始密码都是 docker secret，
# 以文件挂载到 /run/secrets/<属性名>，由 swarm profile 的 configtree 读取，不进环境变量。
version: "3.9"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  rbac-backend:
    image: ${RBAC_BACKEND_IMAGE:?RBAC_BACKEND_IMAGE must be set}
    environment:
      SPRING_PROFILES_ACTIVE: swarm
      PERMISSION_BACKEND_STRATEGY: ${RBAC_BACKEND_STRATEGY:-structured}
      PERMISSION_DB_URL: jdbc:mysql://${DB_HOST:-mysql}:${DB_PORT:-3306}/${RBAC_DB_NAME:-cdwy_rbac}?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
      PERMISSION_DB_USERNAME: ${RBAC_DB_USER:-cdwy_rbac}
      PERMISSION_DB_POOL_SIZE: ${RBAC_DB_POOL_SIZE:-5}
      PERMISSION_BOOTSTRAP_USERNAME: ${RBAC_BOOTSTRAP_USERNAME:-admin}
      # 课程前端的源地址：浏览器直连 /api/apps/** 时放行的跨域来源，多个用逗号分隔
      PERMISSION_CORS_ALLOWED_ORIGINS: ${RBAC_CORS_ALLOWED_ORIGINS:?RBAC_CORS_ALLOWED_ORIGINS must be set}
      PERMISSION_JWT_EXPIRATION_SECONDS: ${RBAC_JWT_EXPIRATION_SECONDS:-1800}
      PERMISSION_LOG_LEVEL: ${RBAC_LOG_LEVEL:-INFO}
      PERMISSION_LOG_LEVEL_INFRASTRUCTURE: ${RBAC_LOG_LEVEL_INFRASTRUCTURE:-INFO}
      JAVA_TOOL_OPTIONS: ${RBAC_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70}
    secrets:
      - source: rbac_db_password
        target: spring.datasource.password
      - source: rbac_jwt_secret
        target: permission.jwt.secret
      - source: rbac_bootstrap_password
        target: permission.bootstrap.password
    volumes:
      - rbac_logs:/app/logs
    networks:
      - javaee-proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    stop_grace_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints: ["node.labels.cdwy.rbac == true"]
      # 节点内存紧张：先停旧任务再启动新任务，避免同时运行两个 JVM
      update_config:
        order: stop-first
        parallelism: 1
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: ${RBAC_BACKEND_MEMORY_LIMIT:-640M}
        reservations:
          memory: 256M
    logging: *default-logging

  rbac-frontend:
    image: ${RBAC_FRONTEND_IMAGE:?RBAC_FRONTEND_IMAGE must be set}
    ports:
      # host 模式只占用所在节点的端口；改用 ingress 时整个集群的同一端口都会被占用
      - target: 80
        published: ${RBAC_HTTP_PORT:-80}
        protocol: tcp
        mode: ${RBAC_PUBLISH_MODE:-host}
    networks:
      - javaee-proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints: ["node.labels.cdwy.rbac == true"]
      update_config:
        order: stop-first
        parallelism: 1
        delay: 5s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 64M
    logging: *default-logging

networks:
  # 集群已有的外部 overlay 网络；课程系统和 lab_mysql（别名 mysql）也在这个网络上
  javaee-proxy:
    external: true

volumes:
  rbac_logs:

secrets:
  rbac_db_password:
    external: true
    name: ${RBAC_DB_PASSWORD_SECRET:-cdwy_rbac_db_password_v1}
  rbac_jwt_secret:
    external: true
    name: ${RBAC_JWT_SECRET_SECRET:-cdwy_rbac_jwt_secret_v1}
  rbac_bootstrap_password:
    external: true
    name: ${RBAC_BOOTSTRAP_PASSWORD_SECRET:-cdwy_rbac_bootstrap_password_v1}
