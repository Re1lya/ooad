# Cdwy 第二次检查：权限系统 + 课程项目管理系统的前后端全部运行在 Docker Swarm。
#
#   浏览器 ──► rbac-frontend:80 (发布 ${RBAC_HTTP_PORT})   ──/api/──►  rbac-backend:18081
#   浏览器 ──► course-frontend:80 (发布 ${COURSE_HTTP_PORT}) ──/api/──►  course-backend:8080
#                                     └─/identity/api/auth/login──►  rbac-backend:18081
#   course-backend ──IDENTITY_BASE_URL=http://rbac-backend:18081/api/apps/cpm──► rbac-backend
#
# 部署：docker stack deploy --with-registry-auth -c deploy/stack.yml cdwy
# 变量见 deploy/.env.example；密码与密钥一律用 docker secret（文件挂载），不写入环境变量。
version: "3.9"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-update: &default-update
  parallelism: 1
  delay: 10s
  order: stop-first
  failure_action: rollback

services:
  rbac-backend:
    image: ${RBAC_BACKEND_IMAGE:?RBAC_BACKEND_IMAGE must be set}
    environment:
      SPRING_PROFILES_ACTIVE: swarm
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
      PERMISSION_BACKEND_STRATEGY: ${RBAC_BACKEND_STRATEGY:-structured}
      PERMISSION_DB_URL: jdbc:mysql://${DB_HOST:?DB_HOST must be set}:${DB_PORT:-3306}/${RBAC_DB_NAME:-cdwy_rbac}?serverTimezone=UTC&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
      PERMISSION_DB_USERNAME: ${RBAC_DB_USER:-cdwy_rbac}
      PERMISSION_BOOTSTRAP_USERNAME: ${RBAC_BOOTSTRAP_USERNAME:-admin}
      PERMISSION_JWT_EXPIRATION_SECONDS: ${RBAC_JWT_EXPIRATION_SECONDS:-1800}
      PERMISSION_LOG_LEVEL: ${RBAC_LOG_LEVEL:-INFO}
      PERMISSION_LOG_LEVEL_INFRASTRUCTURE: ${RBAC_LOG_LEVEL_INFRASTRUCTURE:-INFO}
      JAVA_TOOL_OPTIONS: ${RBAC_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70}
    secrets:
      - source: rbac_db_password
        target: spring.datasource.password
      - source: rbac_jwt_secret
        target: permission.jwt.secret
      - source: rbac_bootstrap_password
        target: permission.bootstrap.password
    volumes:
      - rbac_logs:/app/logs
    networks:
      - cdwy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    stop_grace_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints: ["node.labels.cdwy.rbac == true"]
      update_config: *default-update
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: ${RBAC_BACKEND_MEMORY_LIMIT:-640M}
        reservations:
          memory: 256M
    logging: *default-logging

  rbac-frontend:
    image: ${RBAC_FRONTEND_IMAGE:?RBAC_FRONTEND_IMAGE must be set}
    ports:
      - target: 80
        published: ${RBAC_HTTP_PORT:-18080}
        mode: ingress
    networks:
      - cdwy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints: ["node.labels.cdwy.rbac == true"]
      update_config: *default-update
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 64M
    logging: *default-logging

  course-backend:
    image: ${COURSE_BACKEND_IMAGE:?COURSE_BACKEND_IMAGE must be set}
    environment:
      SPRING_PROFILES_ACTIVE: swarm
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
      APP_BACKEND_STRATEGY: ${COURSE_BACKEND_STRATEGY:-structured}
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST}:${DB_PORT:-3306}/${COURSE_DB_NAME:-course_project}?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${COURSE_DB_USER:-course_project}
      # 统一身份 = Cdwy 权限系统；路径中的 cpm 是课程系统在权限系统中登记的应用编码。
      APP_IDENTITY_BASE_URL: http://rbac-backend:18081/api/apps/${COURSE_APP_CODE:-cpm}
      CORS_ALLOWED_ORIGINS: ${COURSE_CORS_ALLOWED_ORIGINS:-*}
      JAVA_TOOL_OPTIONS: ${COURSE_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70}
      LOGGING_LEVEL_CN_EDU_XMU_PROJECTMGT_API: ${COURSE_LOG_LEVEL:-DEBUG}
      LOGGING_LEVEL_CN_EDU_XMU_PROJECTMGT_SERVICE: ${COURSE_LOG_LEVEL:-DEBUG}
      LOGGING_LEVEL_CN_EDU_XMU_PROJECTMGT_INFRASTRUCTURE: ${COURSE_LOG_LEVEL:-DEBUG}
    secrets:
      - source: course_project_db_password
        target: spring.datasource.password
    networks:
      - cdwy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    stop_grace_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints: ["node.labels.cdwy.course == true"]
      update_config: *default-update
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: ${COURSE_BACKEND_MEMORY_LIMIT:-640M}
        reservations:
          memory: 256M
    logging: *default-logging

  course-frontend:
    image: ${COURSE_FRONTEND_IMAGE:?COURSE_FRONTEND_IMAGE must be set}
    ports:
      - target: 80
        published: ${COURSE_HTTP_PORT:-18090}
        mode: ingress
    networks:
      - cdwy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints: ["node.labels.cdwy.course == true"]
      update_config: *default-update
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 64M
    logging: *default-logging

networks:
  cdwy:
    driver: overlay
    attachable: true

volumes:
  rbac_logs:

secrets:
  rbac_db_password:
    external: true
  rbac_jwt_secret:
    external: true
  rbac_bootstrap_password:
    external: true
  course_project_db_password:
    external: true
